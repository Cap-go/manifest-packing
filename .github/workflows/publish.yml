name: Publish package

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Build and publish to npm
    if: github.repository == 'Cap-go/manifest-packing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$package_version" = "$GITHUB_REF_NAME"

      - name: Run checks
        run: bun run check

      - name: Install npm CLI for staged publishing
        run: npm install -g npm@^11.15.0

      - name: Check whether the package exists on npm
        id: package_status
        run: |
          package_name=$(node -p "require('./package.json').name")
          if lookup=$(npm view "$package_name" version --json 2>&1); then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ "$lookup" == *'E404'* ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$lookup" >&2
            exit 1
          fi

      - name: Publish the first package version to npm
        if: steps.package_status.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest --provenance --access public --ignore-scripts

      - name: Stage publish to npm
        if: steps.package_status.outputs.exists == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          npm stage publish --tag latest --provenance --access public --ignore-scripts

      - name: Request stage approval
        if: steps.package_status.outputs.exists == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.NPM_STAGE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/Cap-go/automations/dispatches \
            -f event_type=npm-stage-approve \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -f "client_payload[package]=$(node -p "require('./package.json').name")"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
